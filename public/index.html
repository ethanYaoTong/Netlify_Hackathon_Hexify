<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Subscription Graveyard</title>
  <meta name="description" content="Upload your bank statement and watch your forgotten subscriptions rise from the grave." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Jersey+10&family=VT323&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body data-screen="landing">
  <!-- CRT effects layered over everything (decorative) -->
  <div class="static" aria-hidden="true"></div>
  <div class="roll" aria-hidden="true"></div>
  <div class="crt" aria-hidden="true"></div>

  <!-- Shown while /api/detect runs -->
  <div id="summoning" class="summoning" hidden>
    <p class="summoning-text">Summoning…</p>
  </div>

  <main id="app">
    <!-- Screen 1: Title screen -->
    <section id="landing" class="screen title-screen">
      <svg class="title-face" viewBox="0 0 14 16" aria-hidden="true"><use href="#zombie-sprite" /></svg>

      <div class="title-content">
        <h1 class="title">
          <span class="glitch" data-text="Subscription">Subscription</span>
          <span class="glitch" data-text="Graveyard">Graveyard</span>
        </h1>
        <p class="tagline">Your forgotten subscriptions are coming back from the dead.</p>

        <nav class="menu" aria-label="Start">
          <button id="demo-btn" class="menu-item">Summon demo graveyard</button>
          <label for="file-input" id="upload-btn" class="menu-item" tabindex="0" role="button">Upload bank statement (CSV)</label>
          <input type="file" id="file-input" accept=".csv,text/csv" hidden />
        </nav>

        <p id="landing-error" class="error" role="alert" hidden></p>
      </div>

      <footer class="title-footer">
        <p>Your transactions are never stored.</p>
        <p id="landing-global" class="global-counter" hidden></p>
      </footer>
    </section>

    <!-- Screen 2: The graveyard (results) -->
    <section id="graveyard" class="screen" hidden>
      <header class="hud">
        <div class="hud-main">
          <h2 id="summary"></h2>
          <p id="summary-sub" class="summary-sub"></p>
        </div>
        <div class="hud-saved">
          <p id="saved" class="saved" aria-live="polite">Saved $0.00 a year</p>
          <p id="equivalents" class="equivalents"></p>
          <button id="leave-btn" class="btn-pixel btn-small">Leave the graveyard</button>
        </div>
      </header>
      <div id="zombies" class="zombies"></div>
      <button id="back-btn" class="btn-pixel">Haunt another statement</button>
    </section>

    <!-- Screen 3: Graveyard cleared (the treat) -->
    <section id="cleared" class="screen cleared-screen" hidden>
      <h2 id="cleared-title" class="cleared-title"></h2>
      <p id="cleared-saved" class="cleared-saved"></p>
      <p id="cleared-count" class="cleared-count"></p>
      <ul id="cleared-equivalents" class="cleared-equivalents"></ul>
      <p id="cleared-global" class="global-counter"></p>
      <button id="again-btn" class="btn-pixel">Haunt another statement</button>
    </section>
  </main>

  <!-- Slay dialog, styled like an RPG text box -->
  <dialog id="slay-dialog" class="dialog" aria-labelledby="slay-title">
    <form method="dialog">
      <div class="dialog-body">
        <div id="slay-portrait" class="portrait"></div>
        <div>
          <h3 id="slay-title" class="dialog-title"></h3>
          <p id="slay-text" class="dialog-text"></p>
        </div>
      </div>
      <div class="dialog-actions">
        <a id="slay-link" class="btn-pixel" target="_blank" rel="noopener noreferrer">Open cancel page ↗</a>
        <button value="slay" class="btn-pixel btn-slay">I've cancelled it. Slay!</button>
        <button value="close" class="btn-text">Not yet</button>
      </div>
    </form>
  </dialog>

  <div id="bats" class="bats" aria-hidden="true"></div>

  <!-- Gravekeeper narrator: Undertale-style text box with scripted lines -->
  <aside id="narrator" class="narrator" aria-label="Gravekeeper" hidden>
    <div id="narrator-portrait" class="narrator-portrait"></div>
    <button id="narrator-advance" class="narrator-advance" aria-label="Next line (or press Z)">
      <span id="narrator-typed" aria-hidden="true"></span>
      <span class="narrator-next" aria-hidden="true"></span>
    </button>
    <div class="narrator-controls">
      <button id="narrator-close" aria-label="Close the gravekeeper">✕</button>
      <button id="narrator-sound" aria-pressed="true">Sound</button>
    </div>
    <p id="narrator-live" class="visually-hidden" aria-live="polite"></p>
  </aside>
  <button id="gravekeeper-btn" class="gravekeeper-btn" aria-label="Ask the gravekeeper for help"></button>

  <script src="app.js"></script>
</body>
</html>
