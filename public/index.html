<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Subscription Graveyard</title>
  <meta name="description" content="Upload your bank statement and watch your forgotten subscriptions rise from the grave." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Creepster&family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- Night-time scenery (purely decorative) -->
  <div class="scenery" aria-hidden="true">
    <div class="stars"></div>
    <div class="moon"></div>
    <div class="fence"></div>
    <div class="fog"><div class="fog-layer"></div><div class="fog-layer fog-layer-2"></div></div>
  </div>

  <!-- Shown while /api/detect runs -->
  <div id="summoning" class="summoning" hidden>
    <p class="summoning-text">🪦 Summoning the dead…</p>
  </div>

  <main id="app">
    <!-- Screen 1: Landing -->
    <section id="landing" class="screen">
      <h1>Subscription Graveyard</h1>
      <p class="tagline">Your forgotten subscriptions are coming back from the dead.</p>

      <button id="demo-btn" class="btn btn-primary">🧟 Summon demo graveyard</button>

      <div class="upload">
        <label for="file-input" class="btn btn-secondary">📄 Upload your bank statement (CSV)</label>
        <input type="file" id="file-input" accept=".csv,text/csv" hidden />
      </div>

      <p class="small-print">🔒 Your transactions are never stored.</p>
      <p id="landing-error" class="error" role="alert" hidden></p>
    </section>

    <!-- Screen 2: The graveyard (results) -->
    <section id="graveyard" class="screen" hidden>
      <header class="graveyard-header">
        <h2 id="summary"></h2>
        <p id="summary-sub" class="summary-sub"></p>
      </header>
      <div id="zombies" class="zombies"></div>
      <button id="back-btn" class="btn btn-secondary">← Haunt another statement</button>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
